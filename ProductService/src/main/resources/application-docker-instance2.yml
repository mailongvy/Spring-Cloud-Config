spring:
  application:
    name: product-service
  profiles:
    active: instance2
  zipkin:
    base-url: http://zipkin:9411
  cloud:
    config:
      uri: http://config-server:8888
      fail-fast: false
  config:
    import: "optional:configserver:http://config-server:8888"
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # DDL auto setting: update, create, create-drop, validate
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    hostname: product-service-2
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${eureka.instance.hostname}:${server.port}
    home-page-url: http://localhost:${server.port}/
    health-check-url: http://localhost:${server.port}/actuator/health
    status-page-url: http://localhost:${server.port}/actuator/info

# Local fallback properties nếu Config Server không khả dụng
app:
  name: ProductService-Instance2
  version: 0.0.1-SNAPSHOT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
